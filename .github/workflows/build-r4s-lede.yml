name: Build R4S (LEDE)

on:
  workflow_dispatch:
    inputs:
      make_release:
        description: '构建完成后发布 Release'
        type: boolean
        default: true

env:
  REPO_URL: https://github.com/coolsnowwolf/lede
  REPO_BRANCH: master
  TZ: Asia/Shanghai

jobs:
  build:
    name: Build R4S
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost /usr/local/share/powershell \
                      /usr/local/graalvm /usr/local/.ghcup \
                      "${AGENT_TOOLSDIRECTORY:-/opt/hostedtoolcache}"
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          df -h /

      - name: Install build dependencies
        run: |
          sudo timedatectl set-timezone "$TZ"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev python3-setuptools python3-dev \
            python3-venv python3-pyelftools rsync swig unzip zlib1g-dev file wget
          # LEDE 额外建议的依赖，逐个安装，个别包名不存在也不影响其余
          for p in ccache ecj fastjar java-propose-classpath libelf-dev libglib2.0-dev \
                   device-tree-compiler python3-ply python3-docutils qemu-utils subversion \
                   upx-ucl zstd libzstd-dev time antlr3 asciidoc autopoint cpio gperf \
                   help2man intltool libfuse-dev libgmp3-dev libltdl-dev libmpc-dev \
                   libmpfr-dev libreadline-dev ninja-build p7zip-full re2c scons \
                   squashfs-tools xmlto xxd; do
            sudo apt-get install -y --no-install-recommends "$p" >/dev/null 2>&1 || echo "跳过: $p"
          done
          sudo apt-get clean

      - name: Set build date
        run: |
          echo "BUILD_DATE=$(date +'%Y%m%d')" >> $GITHUB_ENV
          echo "BUILD_DATE_HUMAN=$(date +'%Y-%m-%d %H:%M')" >> $GITHUB_ENV

      - name: Clone source
        run: |
          git clone --depth=1 -b "$REPO_BRANCH" "$REPO_URL" openwrt
          cd openwrt
          echo "SOURCE_COMMIT=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      - name: Cache downloads and ccache
        uses: actions/cache@v4
        with:
          path: |
            openwrt/dl
            openwrt/.ccache
          key: lede-r4s-${{ hashFiles('config-lede/*.config') }}-${{ env.BUILD_DATE }}
          restore-keys: |
            lede-r4s-${{ hashFiles('config-lede/*.config') }}-
            lede-r4s-

      - name: Update and install feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Prefetch runtime assets
        run: |
          ASSET_DIR="$GITHUB_WORKSPACE/files/etc/openclash"
          mkdir -p "$ASSET_DIR/core"

          curl -fsSL --retry 3 --retry-delay 5 -o /tmp/core.tar.gz \
            "https://raw.githubusercontent.com/vernesong/OpenClash/core/master/meta/clash-linux-arm64.tar.gz"
          tar -xzf /tmp/core.tar.gz -C /tmp
          mv /tmp/clash "$ASSET_DIR/core/clash_meta"
          chmod +x "$ASSET_DIR/core/clash_meta"
          file "$ASSET_DIR/core/clash_meta" | grep -q "ARM aarch64" \
            || { echo "::error::二进制架构不是 aarch64，已中止"; exit 1; }

          curl -fsSL --retry 3 --retry-delay 5 -o "$ASSET_DIR/Country.mmdb" \
            "https://testingcf.jsdelivr.net/gh/alecthw/mmdb_china_ip_list@release/lite/Country.mmdb"
          curl -fsSL --retry 3 --retry-delay 5 -o "$ASSET_DIR/GeoSite.dat" \
            "https://testingcf.jsdelivr.net/gh/Loyalsoldier/v2ray-rules-dat@release/geosite.dat"
          curl -fsSL --retry 3 --retry-delay 5 -o "$ASSET_DIR/GeoIP.dat" \
            "https://testingcf.jsdelivr.net/gh/Loyalsoldier/v2ray-rules-dat@release/geoip.dat"
          ls -lh "$ASSET_DIR" "$ASSET_DIR/core"

      - name: Apply customizations
        run: |
          cd openwrt
          mkdir -p ./files
          cp -rf "$GITHUB_WORKSPACE/files/." ./files/
          bash "$GITHUB_WORKSPACE/scripts/customize.sh"

      - name: Generate .config
        run: |
          cd openwrt
          cat "$GITHUB_WORKSPACE"/config-lede/r4s.config > .config
          make defconfig
          echo "===== 机型 ====="
          grep -E '^CONFIG_TARGET_rockchip_armv8_DEVICE_.*=y' .config
          echo "===== 被 defconfig 丢弃的包（拼错或不存在）====="
          grep -oE '^CONFIG_PACKAGE_[a-zA-Z0-9_.+-]+' "$GITHUB_WORKSPACE"/config-lede/r4s.config \
            | sort -u | while read -r p; do
              grep -q "^${p}=y\|^${p}=m" .config || echo "  !! $p"
            done

      - name: Download package sources
        run: |
          cd openwrt
          make download -j8
          # 只清理 dl 顶层的下载残片，不能递归（会掏空 go-mod-cache）
          find dl -maxdepth 1 -type f -size -1024c -exec ls -lh {} \; -exec rm -f {} \;

      - name: Compile firmware
        run: |
          cd openwrt
          make -j"$(nproc)" || {
            echo "::warning::并行编译失败，回退到单线程输出详细日志"
            make -j1 V=s
          }
          df -h /

      - name: Organize artifacts
        run: |
          cd openwrt/bin/targets/rockchip/armv8
          rm -rf packages feeds.buildinfo version.buildinfo
          cp "$GITHUB_WORKSPACE/openwrt/.config" ./config.buildinfo
          echo "FIRMWARE_DIR=$PWD" >> $GITHUB_ENV
          ls -lh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nanopi-r4s-lede-${{ env.BUILD_DATE }}
          path: ${{ env.FIRMWARE_DIR }}
          retention-days: 30

      - name: Publish release
        if: inputs.make_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: r4s-lede-${{ env.BUILD_DATE }}
          name: NanoPi R4S (LEDE) ${{ env.BUILD_DATE }}
          make_latest: false
          files: ${{ env.FIRMWARE_DIR }}/*
          body: |
            ## NanoPi R4S 固件（LEDE）

            | 项目 | 内容 |
            |---|---|
            | 构建时间 | ${{ env.BUILD_DATE_HUMAN }} (UTC+8) |
            | 源码 | coolsnowwolf/lede `${{ env.REPO_BRANCH }}` @ `${{ env.SOURCE_COMMIT }}` |
            | 包管理器 | opkg |

            部分 R4S 在 ImmortalWrt 25.12 的开源引导链下无法启动，
            此版本改用 LEDE 源码（瑞芯微 rkbin 引导组件）构建。

            ### 默认设置
            - 管理地址 **http://192.168.2.1**
            - 用户名 `root`，密码 **`password`**（LEDE 默认），**首次登录请立刻修改**
            - 主机名 `NanoPi`，时区 `Asia/Shanghai`
            - SSH 主机密钥由设备首次开机随机生成，不预置

            ### 选哪个文件
            - `*-squashfs-sysupgrade.img.gz` —— 带 overlay，支持一键恢复出厂
            - `*-ext4-sysupgrade.img.gz` —— 可扩容根分区

            已安装软件包见 `*.manifest`，编译配置见 `config.buildinfo`，校验值见 `sha256sums`。
